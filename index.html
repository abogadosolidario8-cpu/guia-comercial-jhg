<style>
:root{--az:#0c2350;--or:#c9a24a;--bg:#f4f5f8}
*{box-sizing:border-box;margin:0}body{font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:#222;line-height:1.5}
header{background:linear-gradient(135deg,#0c2350,#173a78);color:#fff;padding:18px;border-bottom:4px solid var(--or)}
.hd{max-width:1100px;margin:auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hd img{width:72px;height:72px;border-radius:50%}.hd h1{font-size:1.5rem}.hd p{opacity:.85;font-size:.9rem}
.hd .sp{flex:1}a.wa{background:#25d366;color:#fff;text-decoration:none;padding:8px 14px;border-radius:20px;font-size:.9rem}
main{max-width:1100px;margin:auto;padding:16px}.box{background:#fff;border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px #0002}
h2{color:var(--az);font-size:1.15rem;margin-bottom:10px}#map{height:380px;border-radius:8px}
input,select,textarea,button{font:inherit;padding:9px;border:1px solid #bbb;border-radius:6px;width:100%}
button{background:var(--az);color:#fff;border:0;cursor:pointer;width:auto;padding:9px 16px}button.s{background:var(--or);color:#000}button.d{background:#b3261e}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:10px}label{font-size:.85rem;color:#444;display:block}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.bar input,.bar select{flex:1;min-width:150px;width:auto}
.card{display:flex;gap:12px;border:1px solid #ddd;border-radius:8px;padding:10px;margin-bottom:10px;background:#fff}
.card img{width:110px;height:90px;object-fit:cover;border-radius:6px;background:#e5e5e5}.card h3{color:var(--az);font-size:1rem}
.card p{font-size:.88rem}.card a{color:#0b57d0;font-size:.88rem;margin-right:10px}.tag{background:#eef;color:var(--az);border-radius:10px;padding:1px 8px;font-size:.78rem}
.hide{display:none}.msg{font-size:.88rem;margin-top:6px;color:#444}footer{text-align:center;padding:18px;font-size:.85rem;color:#555}
:focus-visible{outline:3px solid var(--or)}

 ${n.notas?`<p>${esc(n.notas)}</p>`:''}${n.direccion?`<p>📍 ${esc(n.direccion)}</p>`:''}${n.horario?`<p>🕒 ${esc(n.horario)}</p>`:''}
 <p>${n.latitud?`<a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${n.latitud},${n.longitud}">Cómo llegar</a>`:''}
 ${n.telefono?`<a target="_blank" rel="noopener" href="https://wa.me/${String(n.telefono).replace(/\D/g,'')}">WhatsApp</a>`:''}
 ${adm?`<button class="d" onclick="del('${n.id}')">Eliminar</button>`:''}</p></div></div>`).join(''):'Sin resultados.';
 v.forEach(n=>{if(n.latitud)L.marker([n.latitud,n.longitud]).addTo(layer).bindPopup(`<b>${esc(n.nombre)}</b><br>${esc(n.tipo)}`)})}
async function load(){const{data:d,error}=await sb.from('negocios').select('*').order('created_at',{ascending:false});
 if(error){$('list').textContent='No se pudo cargar: '+error.message;return}data=d;render();
 const pts=d.filter(n=>n.latitud).map(n=>[n.latitud,n.longitud]);if(pts.length)map.fitBounds(pts,{padding:[30,30],maxZoom:16})}
$('q').oninput=$('ft').onchange=render;
async function del(id){if(!confirm('¿Eliminar este negocio?'))return;const{error}=await sb.from('negocios').delete().eq('id',id);if(error)alert(error.message);else load()}
function ui(on){$('adm').classList.toggle('hide',!on);$('login').classList.add('hide');$('btnAdm').classList.toggle('hide',on);render()}
$('btnAdm').onclick=()=>$('login').classList.toggle('hide');
$('go').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});$('lm').textContent=error?'Error: '+error.message:'';if(!error)ui(true)};
$('out').onclick=async()=>{await sb.auth.signOut();ui(false)};
if(OK)sb.auth.getSession().then(({data:{session}})=>{if(session)ui(true)});
$('f').onsubmit=async e=>{e.preventDefault();if(!pos)return alert('Selecciona la ubicación en el mapa, con GPS o UTM');
 $('save').disabled=true;$('fm').textContent='Guardando…';let foto_url=null;const file=$('foto').files[0];
 if(file){const path=Date.now()+'_'+file.name.replace(/[^\w.-]/g,'_');const u=await sb.storage.from('fotos-negocios').upload(path,file);
  if(u.error){$('fm').textContent='Foto: '+u.error.message;$('save').disabled=false;return}foto_url=sb.storage.from('fotos-negocios').getPublicUrl(path).data.publicUrl}
 const row={nombre:$('nombre').value,tipo:$('tipo').value,direccion:$('direccion').value,horario:$('horario').value,telefono:$('telefono').value,notas:$('notas').value,latitud:pos.lat,longitud:pos.lng,foto_url};
 const{error}=await sb.from('negocios').insert(row);$('save').disabled=false;
 if(error){$('fm').textContent='Error: '+error.message;return}$('fm').textContent='✅ Guardado';$('f').reset();$('uz').value=18;load()};
if(OK)load();else $('list').textContent='Falta configurar Supabase (URL y clave) en el archivo, o no cargó la librería por falta de conexión.';
</script></body></html>
